/* ---- ground ---- */
body{background:var(--grain),var(--color-paper);font-size:var(--text-md);line-height:1.5;
  padding-left:max(var(--space-lg),env(safe-area-inset-left,0px));padding-right:max(var(--space-lg),env(safe-area-inset-right,0px));padding-block:var(--space-md) var(--space-2xl)}
h1,h2,h3{max-width:none;text-wrap:balance}
h1{font-size:var(--text-xl)} h2{font-size:var(--text-lg);line-height:1.15} h3{font-size:var(--text-md)}
p:not([class]){max-width:none}
button{cursor:pointer;color:inherit}
input,select,textarea{color:inherit}
a{color:var(--color-accent-2)}
b,strong{font-weight:700}
summary{cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.g-personal{--g:var(--personal);--gs:var(--personal-soft);--gi:var(--personal-ink)}
.g-fiction{--g:var(--fiction);--gs:var(--fiction-soft);--gi:var(--fiction-ink)}
.g-explain{--g:var(--explain);--gs:var(--explain-soft);--gi:var(--explain-ink)}
.g-opinion{--g:var(--opinion);--gs:var(--opinion-soft);--gi:var(--opinion-ink)}
.g-convo{--g:var(--convo);--gs:var(--convo-soft);--gi:var(--convo-ink)}

/* ---- shell ---- */
header.top{max-width:var(--container);margin:0 auto var(--space-md);display:flex;align-items:center;gap:var(--space-sm);flex-wrap:wrap;min-height:48px}
header.top h1{letter-spacing:var(--tracking-display)}

header.top p{color:var(--color-muted)}
.save{margin-left:auto;font-size:var(--text-sm);color:var(--color-muted)}
.wrap{max-width:var(--container);margin:0 auto;display:grid;grid-template-columns:248px minmax(0,1fr);gap:var(--space-lg);align-items:start}

/* ---- controls: card stock that presses ---- */

/* ---- chips and tags ---- */

.chip{border:0;background:var(--grain),var(--color-card);border-radius:var(--radius-pill);min-height:36px;padding:0 var(--space-md);font-family:var(--font-display);font-weight:500;font-size:var(--text-sm);box-shadow:inset 0 0 0 1px var(--color-rule),0 2px 0 0 var(--color-edge);transition:translate var(--dur-micro) var(--ease-snap)}

.chip.on{background:var(--color-ink);color:var(--color-on-ink);box-shadow:none}
.chip.gchip{box-shadow:inset 0 0 0 2px var(--g),0 2px 0 0 var(--color-edge)}

.chip.add{box-shadow:inset 0 0 0 1px var(--color-muted);background:none;color:var(--color-muted)}

.addrow{display:flex;gap:var(--space-xs);flex-wrap:wrap;align-items:center}
.addrow input{max-width:240px}.addrow select{max-width:180px}
.tag{font-size:var(--text-sm);padding:var(--space-3xs) var(--space-xs);border-radius:8px;background:var(--gs,var(--color-paper-2));color:var(--gi,var(--color-ink))}

.agetag{display:inline-block;font-size:var(--text-xs);font-weight:700;padding:var(--space-3xs) var(--space-xs);border-radius:8px;background:var(--color-mint-soft);color:var(--color-mint-deep);vertical-align:1px;font-family:var(--font-body);letter-spacing:0}
.agetag.no{background:var(--color-paper-2);color:var(--color-muted)}
.dtags{display:flex;gap:var(--space-2xs);flex-wrap:wrap}
.dt{font-size:var(--text-xs);color:var(--color-muted);background:var(--color-paper-2);border-radius:6px;padding:0 var(--space-xs);line-height:1.6}
.dt.safe{color:var(--color-error);background:var(--color-error-soft)}
.ex{font-size:var(--text-xs);padding:var(--space-3xs) var(--space-xs);border-radius:6px;background:var(--color-warn-soft);margin-left:auto}

/* ---- triage ---- */
.tri2{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-md);align-items:start}
@media (min-width:68rem){.tri2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}.tri2 .sgt th{width:48px}.tri2 .sgt th:first-child{width:auto}.tri2 .sgt th .lg{display:none}.tri2 .sgt th .sm{display:inline}.tri2 .srcnote{display:none}.tri2 .sgt .dtags{display:none}}
.sgwrap{overflow-x:auto}
.sgt{width:100%;border-collapse:collapse;table-layout:fixed}
.sgt th{font-size:var(--text-sm);font-weight:400;color:var(--color-muted);text-align:center;padding:0 0 var(--space-xs);width:84px}

.sgt th .sm{display:none}
.sgt td{border-top:1px solid var(--color-rule);text-align:center;padding:0}

.sgt .rl{flex:1;min-width:0;border:0;background:none;min-height:48px;padding:var(--space-xs) var(--space-2xs);display:flex;align-items:center;gap:var(--space-sm);text-align:left;font-size:var(--text-md)}
.sgt tr.on .rl{font-weight:700}
.sgt tr.on td{background:var(--color-paper-2)}

.sgt .dot{width:12px;height:12px;border-radius:4px;background:var(--g);flex:none}
.mbx,.ckb{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--color-muted);background:var(--color-card);flex:none;display:grid;place-items:center}

.mbx.on::after,.cki.on .ckb::after{content:"✓";color:var(--color-on-ink);font-size:var(--text-sm);font-weight:700;line-height:1}
.bx{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--color-rule);background:var(--color-card);padding:0;vertical-align:middle}
.bx:hover{border-color:var(--color-muted)}
.bx.on::after{content:"✓";color:var(--color-ink);font-size:var(--text-sm);font-weight:700;line-height:23px}
.bx.s-CG{background:var(--opinion);border-color:var(--opinion)}
.bx.s-T{background:var(--fiction);border-color:var(--fiction)}
.bx.s-Self{background:var(--personal);border-color:var(--personal)}
.bx.s-Clin{background:var(--explain);border-color:var(--explain)}
.s{font-size:var(--text-xs);padding:var(--space-3xs) var(--space-xs);border-radius:6px;background:var(--color-paper-2);color:var(--color-muted)}
.s.on{font-weight:700;color:var(--color-ink)}
.s.s-CG{background:var(--opinion-soft)}.s.s-T{background:var(--fiction-soft)}.s.s-Self{background:var(--personal-soft)}.s.s-Clin{background:var(--explain-soft)}
.cw{display:inline-flex;align-items:center;gap:var(--space-2xs);flex-wrap:wrap}
.src{display:inline-flex;gap:var(--space-3xs)}
.leg{font-size:var(--text-sm);color:var(--color-muted)}.leg b{color:var(--color-ink)}
.xdel{border:0;background:none;color:var(--color-muted);font-size:var(--text-md);padding:0 var(--space-2xs)}
.srcnote{font-size:var(--text-sm);color:var(--color-muted);float:right;padding-right:var(--space-xs)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.info{margin-left:auto;border:0;background:none;color:var(--color-muted);font-size:var(--text-sm);padding:var(--space-2xs) var(--space-xs);border-radius:8px;white-space:nowrap}
.info:hover,.info.open{background:var(--color-card);color:var(--color-ink)}
.sgt tr.det td{border-top:0;text-align:left;background:var(--color-paper-2);padding:0 var(--space-sm) var(--space-sm) var(--space-xl)}
.detg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-xs) var(--space-lg);font-size:var(--text-sm)}
.detg .k{font-size:var(--text-sm);color:var(--color-muted)}
.detg ul{margin:var(--space-2xs) 0 0;padding-left:var(--space-md);display:flex;flex-direction:column;gap:var(--space-2xs)}
.lt{display:flex;flex-direction:column;gap:var(--space-3xs)}
.fil{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--space-xs)}
.fil li{background:var(--color-paper-2);border-radius:var(--radius-stock);padding:var(--space-xs) var(--space-sm);font-size:var(--text-sm);display:flex;flex-direction:column;gap:var(--space-2xs)}
@media (max-width:40rem){.sgt th{width:46px}.sgt th .lg{display:none}.sgt th .sm{display:inline}.info{font-size:0;padding:var(--space-xs)}.info span{font-size:var(--text-sm)}.srcnote,.sgt .dtags{display:none}}
details.moreopts>summary{font-size:var(--text-sm);color:var(--color-muted);padding:var(--space-2xs) 0}
details.moreopts[open]>summary{margin-bottom:var(--space-2xs)}

/* the genre tiles: the tool's own object */
.sug{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--space-sm)}
.scard{border-radius:var(--radius-stock);padding:var(--space-md);background:var(--grain),var(--gs);color:var(--color-ink);display:flex;flex-direction:column;gap:var(--space-xs)}

.scard ul{margin:0;padding-left:var(--space-md);font-size:var(--text-sm);display:flex;flex-direction:column;gap:var(--space-2xs)}
.scard.skip{background:var(--color-paper-2);color:var(--color-muted)}
.gpicks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--space-xs)}
.gpick{border-radius:var(--radius-stock);text-align:left;display:flex;flex-direction:column;gap:var(--space-3xs);padding:var(--space-xs) var(--space-sm);font-weight:600;height:auto}

.pgoals{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-sm)}

.pgt{font-weight:700}.pgw{font-size:var(--text-sm)}
.pg .btn{align-self:flex-start}

/* ---- assessment ---- */
.astabs{display:flex;gap:var(--space-xs);flex-wrap:wrap;align-items:center}
.ast{border:0;background:var(--grain),var(--gs,var(--color-card));border-radius:var(--radius-stock);min-height:44px;padding:0 var(--space-md);font-family:var(--font-display);font-weight:600;font-size:var(--text-md);box-shadow:0 var(--edge) 0 0 var(--g,var(--color-edge));transition:translate var(--dur-micro) var(--ease-snap),box-shadow var(--dur-micro) var(--ease-snap)}
.ast:hover{translate:0 -1px}
.ast.on{background:var(--grain),var(--g);translate:0 2px;box-shadow:0 1px 0 0 var(--gi)}
.ast.sum{--g:var(--color-edge);--gs:var(--color-card);--gi:var(--color-ink)}
.ast.sum.on{background:var(--color-ink);color:var(--color-on-ink);box-shadow:none}
.bpdrop{margin-left:auto;position:relative}
.bpdrop>summary{font-size:var(--text-sm);color:var(--color-muted);min-height:36px;display:flex;align-items:center;padding:0 var(--space-sm);border-radius:var(--radius-input);list-style:none}
.bpdrop>summary:hover{background:var(--color-paper-2);color:var(--color-ink)}
.bpdrop[open]>.bpc{position:absolute;right:0;top:44px;z-index:var(--z-dropdown);width:min(560px,86vw);background:var(--color-card);border-radius:var(--radius-card);padding:var(--space-md);box-shadow:var(--shadow-pop)}
.ascols{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-md);align-items:start}
@media (min-width:68rem){.ascols{grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr)}}
.ascol{display:flex;flex-direction:column;gap:var(--space-md);min-width:0}
.ascol2{padding:var(--space-xs) var(--space-xs) var(--space-md)}
.tierhead{padding:var(--space-md) var(--space-md) var(--space-2xs);font-family:var(--font-display);font-weight:600;font-size:var(--text-md);color:var(--color-ink)}
.itgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--space-xs);padding:var(--space-2xs) var(--space-xs) var(--space-xs)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-xs) var(--space-sm);padding:var(--space-sm) var(--space-md);border-top:1px solid var(--color-rule);align-items:center}
.itgrid .item{grid-template-columns:minmax(0,1fr);border:0;background:var(--color-paper-2);border-radius:var(--radius-stock);padding:var(--space-sm)}
.item .q{font-size:var(--text-sm);color:var(--color-muted)}
.item .lvdesc{grid-column:1/-1;font-size:var(--text-sm);background:var(--gs);border-radius:var(--radius-input);padding:var(--space-xs) var(--space-sm)}

.item details ol{margin:var(--space-2xs) 0 0;padding-left:var(--space-md)}
.item.nyet>div:first-child,.lib.nyet{opacity:.6}
/* rating: four pressable tiles that fill with mint as the skill grows */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:var(--space-2xs)}

.seg button{border:0;background:var(--color-card);border-radius:var(--radius-input);min-height:36px;padding:0 var(--space-3xs);font-size:var(--text-sm);color:var(--color-muted);box-shadow:inset 0 0 0 1px var(--color-rule),0 2px 0 0 var(--color-edge);transition:translate var(--dur-micro) var(--ease-snap)}
.seg button:hover{color:var(--color-ink)}
.seg button.on{translate:0 2px;font-weight:700;color:var(--color-ink);box-shadow:inset 0 0 0 1.5px var(--color-ink)}
.seg button.on[data-v="0"]{background:var(--color-paper-3)}
.seg button.on[data-v="1"]{background:var(--color-mint-soft)}
.seg button.on[data-v="2"]{background:var(--color-mint-mid)}
.seg button.on[data-v="3"]{background:var(--color-mint);color:var(--color-accent-ink)}
.libseg{display:flex;flex-wrap:wrap;width:auto}
.libseg button{flex:none;padding:0 var(--space-sm)}
.libseg button.on{background:var(--color-ink);color:var(--color-on-ink);box-shadow:none}
.more>summary{padding:var(--space-sm) var(--space-md);font-family:var(--font-display);font-weight:500}
.card>.more>summary,.card[style*="padding:0"]>.more>summary{padding:var(--space-md) var(--space-lg)}
.notes{padding:var(--space-sm) var(--space-md);border-top:1px solid var(--color-rule)}
.attr{padding:var(--space-xs) var(--space-md);font-size:var(--text-sm);color:var(--color-muted)}
details.elicit>summary{font-weight:700;font-size:var(--text-sm)}
details.elicit .detg{margin-top:var(--space-xs)}
.gband{background:var(--grain),var(--g);color:var(--on-solid);padding:var(--space-md) var(--space-lg);display:flex;flex-direction:column;gap:var(--space-3xs)}
.gband p{font-size:var(--text-sm)}
.prompt{padding:var(--space-sm) var(--space-md);font-size:var(--text-sm);color:var(--color-muted);border-bottom:1px solid var(--color-rule)}
.prompt b{color:var(--color-ink)}
.tales{background:var(--grain),var(--gs);border-radius:var(--radius-stock);padding:var(--space-sm) var(--space-md);display:flex;flex-direction:column;gap:var(--space-2xs);font-size:var(--text-sm)}
.tales a{color:inherit;font-weight:700}
.tales details>summary{font-weight:700}
.tales ol,.tales ul{margin:var(--space-2xs) 0 0;padding-left:var(--space-md);display:flex;flex-direction:column;gap:var(--space-2xs)}
.selurl{user-select:all;font-family:var(--font-outlier);background:var(--color-card);padding:var(--space-3xs) var(--space-xs);border-radius:6px}
.gck{display:flex;flex-direction:column;gap:var(--space-sm);background:var(--grain),var(--gs);border-radius:var(--radius-card);padding:var(--space-md)}
.ckh{display:flex;justify-content:space-between;align-items:baseline}
.cks{font-family:var(--font-display);font-weight:600;font-size:var(--text-2xl);line-height:1;font-variant-numeric:tabular-nums}.cks small{font-size:var(--text-md);color:var(--color-muted)}
.ckl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-xs)}
.cki{display:flex;align-items:center;gap:var(--space-xs);text-align:left;border:0;background:var(--color-card);border-radius:var(--radius-input);min-height:44px;padding:var(--space-xs) var(--space-sm);font-size:var(--text-sm);box-shadow:0 2px 0 0 var(--color-edge);transition:translate var(--dur-micro) var(--ease-snap)}

.thc,.bpc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-xs) var(--space-md);padding:var(--space-2xs) var(--space-md) var(--space-sm);font-size:var(--text-sm)}
.thc label,.bpc label{display:flex;gap:var(--space-xs);align-items:flex-start}
.sumg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-sm)}
.sumc{background:var(--grain),var(--gs);border-radius:var(--radius-stock);padding:var(--space-sm) var(--space-md);font-size:var(--text-sm)}

.sgi{display:grid;grid-template-columns:36px minmax(0,1fr);gap:var(--space-sm);align-items:start;background:var(--color-paper-2);border-radius:var(--radius-stock);padding:var(--space-sm)}
.sgn{width:32px;height:32px;border-radius:8px;background:var(--sc);color:var(--color-accent-ink);display:grid;place-items:center;font-weight:600;font-family:var(--font-display)}

.sge{font-size:var(--text-sm);color:var(--color-muted)}
.sgw{font-family:var(--font-display);font-weight:600;font-size:var(--text-lg);line-height:1.2}

/* persuasive dump zone */

.psgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--space-xs);margin:var(--space-sm) 0}
.psgrid>div{background:var(--gs);border-radius:var(--radius-input);padding:var(--space-xs) var(--space-sm)}
.psgrid b{display:block;font-family:var(--font-display);font-weight:600;font-size:var(--text-lg);font-variant-numeric:tabular-nums}.psgrid span{font-size:var(--text-sm);color:var(--color-muted)}
.pschips{display:flex;flex-wrap:wrap;gap:var(--space-2xs);margin:var(--space-2xs) 0}
.pschip{font-size:var(--text-sm);border-radius:8px;padding:var(--space-3xs) var(--space-xs);background:var(--color-paper-2);color:var(--color-muted)}
.pschip.y{background:var(--gs);color:var(--color-ink);font-weight:700}
.psbars{display:grid;gap:var(--space-xs);margin:var(--space-sm) 0}
.psbar{display:grid;grid-template-columns:minmax(110px,150px) 1fr auto;gap:var(--space-xs);align-items:center;font-size:var(--text-sm)}
.psbar .tr{position:relative;height:12px;background:var(--color-paper-2);border-radius:6px}

.pss{display:grid;gap:var(--space-2xs);margin:var(--space-xs) 0}
.pss details{background:var(--color-paper-2);border-radius:var(--radius-input);padding:var(--space-xs) var(--space-sm);font-size:var(--text-sm)}
.pss summary{display:flex;justify-content:space-between;gap:var(--space-xs)}
.pss .dots{letter-spacing:2px;color:var(--gi);white-space:nowrap}

.psai{border-top:1px solid var(--color-rule);margin-top:var(--space-sm);padding-top:var(--space-sm)}

/* ---- plan ---- */
.plan2{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-md);align-items:start}
@media (min-width:68rem){.plan2{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}
.pcol{display:flex;flex-direction:column;gap:var(--space-md);min-width:0}
.pstack{display:flex;flex-direction:column;gap:var(--space-sm)}
.hero{background:var(--grain),var(--g);color:var(--on-solid);border-radius:var(--radius-card);box-shadow:var(--shadow-sheet);padding:var(--space-lg);display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2xs) var(--space-md)}
.hero .num,.pcard .num{font-family:var(--font-display);font-weight:600;line-height:1;grid-row:span 3;font-variant-numeric:tabular-nums}
.hero .num{font-size:var(--text-3xl);font-variant-numeric:tabular-nums}.pcard .num{font-size:var(--text-xl)}
.hero .eyebrow{font-size:var(--text-sm)}
.hero h2{font-size:var(--text-xl)}
.hero dl,.pcard dl{margin:var(--space-xs) 0 0;display:grid;grid-template-columns:100px minmax(0,1fr);gap:var(--space-2xs) var(--space-sm);font-size:var(--text-sm)}
.hero dt,.pcard dt{font-weight:700}.hero dd,.pcard dd{margin:0}
.pcard{background:var(--grain),var(--gs);border-radius:var(--radius-card);padding:var(--space-md);display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-3xs) var(--space-sm)}
@media (max-width:40rem){.hero dl,.pcard dl{grid-template-columns:minmax(0,1fr)}}
.goal{background:var(--color-paper-2);border-radius:var(--radius-stock);display:block}
.goal>div{padding:var(--space-md);display:flex;flex-direction:column;gap:var(--space-sm)}
.gtop{display:flex;align-items:baseline;gap:var(--space-sm);flex-wrap:wrap}
.gdet>summary{font-size:var(--text-sm);font-weight:700}
.gdet[open]>summary{margin-bottom:var(--space-xs)}
.gdet .field{margin-top:var(--space-xs)}
.sess{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--space-xs)}
.sess div{background:var(--color-card);border-radius:var(--radius-input);padding:var(--space-xs) var(--space-sm);font-size:var(--text-sm)}
.sess b{display:block;color:var(--gi)}
.track{display:flex;flex-wrap:wrap;gap:var(--space-2xs)}
.tchip{font-size:var(--text-sm);background:var(--color-card);border-radius:8px;padding:var(--space-3xs) var(--space-2xs) var(--space-3xs) var(--space-xs);font-variant-numeric:tabular-nums}
.tx{border:0;background:none;color:var(--color-muted);padding:0 var(--space-xs)}

/* ---- session ---- */
.ladder{display:flex;flex-direction:column;gap:var(--space-xs)}
.rung{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:var(--space-sm);align-items:center;border-radius:var(--radius-stock);padding:var(--space-sm) var(--space-md);background:var(--grain),var(--gs)}
.rung:nth-child(1){background:var(--grain),var(--g)}
.rung .n{font-family:var(--font-display);font-weight:600;font-size:var(--text-xl);text-align:center;font-variant-numeric:tabular-nums}
.rung .t{font-weight:700;font-size:var(--text-sm)}
.rung .say{font-size:var(--text-md)}
.rung.hit{outline:3px solid var(--color-ink);outline-offset:-3px}
.listen{display:flex;flex-direction:column;gap:var(--space-2xs)}
.listen label{display:flex;gap:var(--space-xs);align-items:flex-start;font-size:var(--text-sm);background:var(--color-paper-2);border-radius:var(--radius-input);padding:var(--space-xs) var(--space-sm)}
.qlist{margin:0;padding-left:var(--space-md);display:flex;flex-direction:column;gap:var(--space-2xs);font-size:var(--text-sm)}

/* ---- parent sheet ---- */
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--space-xs)}
.gbox{background:var(--grain),var(--g);color:var(--on-solid);border-radius:var(--radius-stock);padding:var(--space-sm);display:flex;flex-direction:column;gap:var(--space-2xs);font-size:var(--text-sm)}
.where{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--space-sm)}
.wcard{border-radius:var(--radius-stock);background:var(--grain),var(--gs);overflow:hidden}
.wcard>h3{background:var(--grain),var(--g);color:var(--on-solid);padding:var(--space-xs) var(--space-sm)}
.wcard>div{padding:var(--space-sm);display:flex;flex-direction:column;gap:var(--space-2xs);font-size:var(--text-sm)}
.wcard .k{font-weight:700;margin-top:var(--space-2xs)}
.sheet{display:flex;flex-direction:column;gap:var(--space-sm)}
.sheet ul{margin:0;padding-left:var(--space-lg);display:flex;flex-direction:column;gap:var(--space-2xs)}
.org{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-xs)}
.obox{background:var(--gs);border-radius:var(--radius-input);padding:var(--space-xs) var(--space-sm);min-height:64px;display:flex;flex-direction:column;gap:var(--space-3xs);font-size:var(--text-sm)}
.obox b{color:var(--gi)}

/* ---- library and references ---- */
.typ{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-xs);padding:var(--space-sm) var(--space-md);font-size:var(--text-sm)}
.typ>div{background:var(--gs);border-radius:var(--radius-input);padding:var(--space-xs) var(--space-sm);display:flex;flex-direction:column;gap:var(--space-3xs)}
.typ .k{font-weight:700}
.typ .dimb{opacity:.5}
.libgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.lib{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-xs) var(--space-md);padding:var(--space-sm) var(--space-md);border-top:1px solid var(--color-rule)}
.lib .q{font-size:var(--text-sm);color:var(--color-muted);margin-bottom:var(--space-2xs)}
.lib dl{margin:0;display:grid;grid-template-columns:84px minmax(0,1fr);gap:var(--space-2xs) var(--space-sm);font-size:var(--text-sm)}
.lib dt{font-weight:700;color:var(--gi)}
.lib dd{margin:0}
.pcp{background:var(--grain),var(--color-card);border-radius:var(--radius-stock);box-shadow:var(--shadow-sheet)}
.pcp>summary{padding:var(--space-sm) var(--space-md);font-family:var(--font-display);font-weight:600;font-size:var(--text-md);display:flex;align-items:center;gap:var(--space-sm)}
.pcp>summary::before{content:"";width:14px;height:14px;border-radius:4px;background:var(--pc);flex:none}
.pcb{padding:0 var(--space-md) var(--space-md);display:flex;flex-direction:column;gap:var(--space-xs);font-size:var(--text-sm);max-width:90ch}
.pcb ol,.pcb ul{margin:0;padding-left:var(--space-lg);display:flex;flex-direction:column;gap:var(--space-2xs)}
.bpcard{padding:var(--space-sm) var(--space-md)}.bpcard .bpc{padding:var(--space-sm) 0 0}
.ptab{border-collapse:collapse;width:100%;font-size:var(--text-sm)}
.ptab th{text-align:left;font-weight:400;color:var(--color-muted);padding:var(--space-2xs) var(--space-xs)}
.ptab td{border-top:1px solid var(--color-rule);padding:var(--space-xs);vertical-align:top}
.ref{padding:var(--space-sm) 0;border-top:1px solid var(--color-rule);font-size:var(--text-sm);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2xs) var(--space-sm)}
.ref .why{color:var(--color-muted)}
.rtag{font-size:var(--text-xs);padding:var(--space-3xs) var(--space-xs);border-radius:6px;background:var(--color-paper-2);color:var(--color-muted);align-self:start;white-space:nowrap}
.ref.used .rtag.u{background:var(--color-mint-soft);color:var(--color-mint-deep);font-weight:700}
.rtag.chk{background:var(--color-warn-soft);color:var(--color-ink)}
@media (prefers-reduced-motion:reduce){.btn,.chip,.ast,.seg button,.cki,.sn{transition:none}}
/* text on a solid genre tile stays dark in both themes */
.ast.on,.scard.first,.rung:nth-child(1){color:var(--on-solid)}
.ast.sum.on{color:var(--color-on-ink)}

/* colour budget: a genre's solid colour sits only on small marks and on the chosen tile; large sheets stay pale */
.hero{background:var(--grain),var(--gs);color:var(--color-ink);box-shadow:none}
.hero .num,.pcard .num,.rung .n{align-self:start;background:var(--g);color:var(--on-solid);border-radius:var(--radius-input);min-width:44px;padding:var(--space-xs);text-align:center}
.hero .num{font-size:var(--text-2xl)}
.pcard .num{font-size:var(--text-lg);min-width:36px;padding:var(--space-2xs)}
.rung,.rung:nth-child(1){background:var(--color-paper-2);color:var(--color-ink)}
.rung .n{font-size:var(--text-lg);align-self:center}
.gband{background:var(--grain),var(--gs);color:var(--color-ink);border-bottom:3px solid var(--g)}
.gbox{background:var(--grain),var(--gs);color:var(--color-ink);border-top:4px solid var(--g)}
.wcard{background:var(--color-paper-2)}
.wcard>h3{background:none;color:var(--color-ink);border-bottom:3px solid var(--g);padding-bottom:var(--space-2xs)}
.scard.first{background:var(--grain),var(--gs);color:var(--color-ink);box-shadow:inset 0 0 0 2px var(--g)}
.gck,.tales,.pg,.pcard,.sumc{background:var(--color-paper-2);color:var(--color-ink)}
.tales{box-shadow:inset 0 0 0 1px var(--g)}
.gck .cks{color:var(--gi)}
.ast{background:var(--grain),var(--color-card)}

/* ---- density pass: each step should sit on about one screen at 1440 x 900 ---- */
:root{--ctl:34px}
body{padding-block:var(--space-sm) var(--space-xl)}
header.top{min-height:36px;margin-bottom:var(--space-xs)}
.logo{width:32px;height:32px;font-size:var(--text-md);border-radius:var(--radius-input)}
header.top h1{font-size:var(--text-lg)}
.wrap{gap:var(--space-md)}
.pane,.body,.ascol,.pcol{gap:var(--space-sm)}
.rail{padding:var(--space-sm);gap:var(--space-2xs);top:var(--space-sm)}
.sn{min-height:38px;padding:var(--space-2xs) var(--space-xs)}
.sn i{width:24px;height:24px}
.head{padding:var(--space-xs) var(--space-md) var(--space-sm);gap:var(--space-sm)}
.head .field{gap:0}
.head .field label,.field label{font-size:var(--text-xs)}
.card{padding:var(--space-md);gap:var(--space-xs)}
.card:has(>.trow:only-child){padding-block:var(--space-xs)}
.chip{min-height:32px;padding:0 var(--space-sm)}
textarea{min-height:56px}
.sgt .rl{min-height:38px;padding-block:var(--space-2xs);font-size:var(--text-sm)}
.sgt th{padding-bottom:var(--space-2xs)}
.bx{width:24px;height:24px}.bx.on::after{line-height:21px}
.mbx,.ckb{width:20px;height:20px}
/* triage in three columns */
.tri3{gap:var(--space-sm)}
@media (min-width:76rem){
  .tri3{grid-template-columns:minmax(0,1.3fr) minmax(0,1.05fr) minmax(0,.9fr)}
  .tri3 .sgt th{width:36px}.tri3 .sgt th:first-child{width:auto}
  .tri3 .info{font-size:0;padding:var(--space-2xs)}.tri3 .info span{font-size:var(--text-sm)}
}
.gsel .sug{grid-template-columns:minmax(0,1fr);gap:var(--space-xs)}
.scard{padding:var(--space-sm);gap:var(--space-3xs)}
.scard h3{font-size:var(--text-md)}
.scard .why1,.whymore{font-size:var(--text-sm)}
.whymore summary{color:var(--color-muted)}
.whymore ul{margin:var(--space-2xs) 0 0;padding-left:var(--space-md);display:flex;flex-direction:column;gap:var(--space-2xs)}
.gsel .gpicks{display:flex;flex-wrap:wrap;gap:var(--space-2xs)}
.gsel .gpick{min-height:32px;padding:0 var(--space-sm);flex-direction:row;align-items:center;border-radius:var(--radius-pill);font-weight:500}
.gsel .gpick small{display:none}
details.pgd>summary,details.sgd>summary{display:flex;align-items:baseline;gap:var(--space-sm);list-style:none}
details.pgd>summary::after,details.sgd>summary::after,details.proto>summary::after{content:"Show";margin-left:auto;font-size:var(--text-sm);color:var(--color-muted)}
details.pgd[open]>summary::after,details.sgd[open]>summary::after,details.proto[open]>summary::after{content:"Hide"}
details.pgd[open]>summary{margin-bottom:var(--space-xs)}
details.sgd>summary{padding:var(--space-xs) var(--space-md)}
details.sgd>.card>h2{display:none}
details.proto>summary{display:flex;align-items:center;gap:var(--space-xs);list-style:none}
details.proto[open]>summary{margin-bottom:var(--space-2xs)}
/* session in three columns */
.ses3{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-sm);align-items:start}
@media (min-width:76rem){.ses3{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr)}}
.rung{grid-template-columns:36px minmax(0,1fr) auto;padding:var(--space-xs) var(--space-sm);gap:var(--space-xs)}
.rung .say{font-size:var(--text-sm)}
.rung .n{min-width:32px;padding:var(--space-2xs)}
.listen label{padding:var(--space-2xs) var(--space-xs)}
/* assessment */
@media (min-width:76rem){.ascols{grid-template-columns:minmax(0,.72fr) minmax(0,1.6fr)}}
.itgrid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.itgrid .item{padding:var(--space-xs) var(--space-sm);gap:var(--space-2xs)}
.seg button{min-height:32px}
.tierhead{padding:var(--space-sm) var(--space-sm) 0}
.ascol2{padding:0 var(--space-2xs) var(--space-xs)}
.gck{padding:var(--space-sm);gap:var(--space-xs)}
.ckl{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-2xs)}
.cki{min-height:36px;padding:var(--space-2xs) var(--space-xs)}
.more>summary,.card>.more>summary,.card[style*="padding:0"]>.more>summary{padding:var(--space-xs) var(--space-md)}
/* plan */
.hero{padding:var(--space-md)}
.hero h2{font-size:var(--text-lg)}
.hero dl,.pcard dl{margin-top:var(--space-2xs);grid-template-columns:76px minmax(0,1fr);gap:var(--space-3xs) var(--space-sm)}
.pcard{padding:var(--space-sm)}
.goal>div{padding:var(--space-sm);gap:var(--space-xs)}
.fil li{padding:var(--space-2xs) var(--space-sm)}
/* parent sheet */
.gbox{padding:var(--space-xs) var(--space-sm)}
.wcard>div{padding:var(--space-xs) var(--space-sm)}
:root{--text-ctl:0.8125rem}
.itgrid .seg{gap:var(--space-3xs)}
.itgrid .seg button{font-size:var(--text-ctl);white-space:nowrap;padding:0}
@media (min-width:76rem){.ascols{grid-template-columns:minmax(0,.62fr) minmax(0,1.6fr)}}
.ckl{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.obox{min-height:44px;padding:var(--space-2xs) var(--space-sm)}

/* ---- client strip folds to one line; on narrow screens the rail becomes a two-row bar ---- */
.headd>summary{display:none;align-items:baseline;gap:var(--space-xs);list-style:none;background:var(--grain),var(--color-card);border-radius:var(--radius-stock);box-shadow:var(--shadow-sheet);padding:var(--space-xs) var(--space-md);min-height:40px}
.headd:not([open])>summary{display:flex}
.headd .hedit{margin-left:auto;font-size:var(--text-sm);color:var(--color-muted)}
@media (max-width:60rem){
  .headd>summary{display:flex}
  .headd[open]>summary{margin-bottom:var(--space-xs)}
  .headd[open] .hedit{visibility:hidden}
  .head{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rail,.wrap.rc .rail{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;padding:var(--space-xs);gap:var(--space-xs)}
  .rail .cap,.rail .grp,.rail #storeNote,.rail .railtog{display:none}
  .rail #clientSel,.wrap.rc #clientSel{display:block;flex:1;min-width:0;width:auto}
  .rail #addClient{font-size:0;padding:0;width:var(--ctl);flex:none}
  .rail #addClient::after{content:"+";font-size:var(--text-lg)}
  .snav,.wrap.rc .snav{flex-basis:100%;display:flex;flex-direction:row;flex-wrap:nowrap;gap:var(--space-2xs);overflow-x:auto}
  .sn,.wrap.rc .sn{flex:none;min-height:36px;padding:var(--space-2xs);justify-content:flex-start}
  .sn span,.sn .ck{display:none}
  .sn.on{padding-right:var(--space-sm)}
  .sn.on span,.wrap.rc .sn.on span{display:inline}
}
.lt{overflow-wrap:anywhere;min-width:0}
@media (max-width:40rem){
  body{padding-left:max(var(--space-sm),env(safe-area-inset-left,0px));padding-right:max(var(--space-sm),env(safe-area-inset-right,0px))}
  .card{padding:var(--space-sm)}
  .sgt th{width:32px;font-size:var(--text-xs)}
  .bx{width:22px;height:22px}.bx.on::after{line-height:19px}
  .sgt .rl{gap:var(--space-xs);padding-inline:0}
  .info{padding:var(--space-2xs)}
}
/* the client row can be put away; on a narrow screen that leaves just the row of steps */
.railtog .tw{display:none}
@media (max-width:60rem){
  .rail .railtog,.wrap.rc .rail .railtog{display:inline-flex;align-items:center;gap:var(--space-2xs);order:3;align-self:center;margin:0;min-height:var(--ctl);padding:0 var(--space-xs);font-size:var(--text-sm);flex:none}
  .rail .snav{order:4}
  .wrap.rc .rail #clientSel,.wrap.rc .rail #addClient{display:none}
  .wrap.rc .rail .snav{order:1;flex:1 1 0;min-width:0}
  .wrap.rc .rail .railtog{order:2}
  .wrap.rc .railtog .tw{display:inline}
}
@media (max-width:40rem){.wrap.rc .railtog .tw{display:none}}
.sgt th .xall{margin-left:calc(var(--space-sm) * -1);font-family:var(--font-body);min-height:28px}
.sgt tr.det td{padding-left:var(--space-lg)}
.sgt tr.det .detg{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-xs) var(--space-md)}
/* step names can be shown in full on a narrow screen */
.steprow{display:contents}
.steptog{display:none}
@media (max-width:60rem){
  .rail .steprow{display:flex;align-items:flex-start;gap:var(--space-xs);flex-basis:100%;order:4;min-width:0}
  .wrap.rc .rail .steprow{order:1;flex:1 1 0}
  .rail .steprow .snav,.wrap.rc .rail .steprow .snav{flex:1 1 0;min-width:0;order:0}
  .steptog{display:inline-flex;align-items:center;flex:none;border:0;background:none;color:var(--color-muted);font-size:var(--text-sm);min-height:36px;padding:0 var(--space-xs);border-radius:var(--radius-input)}
  .steptog:hover{color:var(--color-ink);background:var(--color-paper-3)}
  .rail.names .snav,.wrap.rc .rail.names .snav{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));overflow:visible}
  .rail.names .sn span,.wrap.rc .rail.names .sn span{display:inline}
  .rail.names .sn .ck,.wrap.rc .rail.names .sn .ck{display:inline}
  .rail.names .sn,.wrap.rc .rail.names .sn{padding-right:var(--space-xs)}
}
@media (max-width:40rem){.rail.names .steprow{flex-wrap:wrap}.rail.names .steptog{margin-left:auto;min-height:28px}}
@media (max-width:40rem){.rail.names .steprow .snav,.wrap.rc .rail.names .steprow .snav{flex:1 1 100%}}

/* protocol panels: full-width, readable */
.protorow{display:flex;flex-direction:column;gap:var(--space-xs);margin-bottom:var(--space-sm)}
details.proto{font-size:var(--text-base,1rem);line-height:1.5;padding:var(--space-xs) var(--space-md)}
details.proto>summary{min-height:var(--ctl);cursor:pointer}
details.proto[open]{padding-bottom:var(--space-md)}
.pbody{display:flex;flex-direction:column;gap:var(--space-sm)}
.plead{max-width:70ch;margin:0}
.pcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:var(--space-md) var(--space-lg)}
.pcols section{min-width:0;display:flex;flex-direction:column;gap:var(--space-2xs)}
.pcols h3{font-family:var(--font-display);font-size:var(--text-md,1.0625rem);font-weight:600;margin:var(--space-xs) 0 0}
.pcols section>h3:first-child{margin-top:0}
.pcols p{margin:var(--space-2xs) 0 0}
.pcols ol,.pcols ul{gap:var(--space-xs);padding-left:var(--space-md)}
.pcols li{padding-left:var(--space-3xs)}
details.pin{margin-top:var(--space-xs);border-top:1px solid var(--color-rule,var(--line));padding-top:var(--space-xs)}
details.pin>summary{cursor:pointer}
details.pin ol{font-size:var(--text-sm)}
/* photo prompts */
.pnv{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--space-md);align-items:start;background:var(--color-paper,var(--panel));border-radius:var(--radius-stock);padding:var(--space-sm)}
.pnfig{margin:0;display:flex;justify-content:center;background:var(--color-paper-2);border-radius:calc(var(--radius-stock) - 4px);overflow:hidden}
.pnfig img{display:block;max-width:100%;width:auto;height:auto;max-height:22rem;object-fit:contain}
.pnside{display:flex;flex-direction:column;gap:var(--space-xs);min-width:0}
.pnside h3{font-family:var(--font-display);font-size:var(--text-lg,1.25rem);font-weight:600;margin:0}
.pnside p{margin:0}
.pnsay{font-size:var(--text-md,1.0625rem);font-weight:700}
.pnnote{font-size:var(--text-sm);color:var(--color-muted)}
.pnyn{font-size:var(--text-sm)}
.pnnav{display:flex;flex-wrap:wrap;gap:var(--space-xs);margin-top:var(--space-2xs)}
#pnOver{position:fixed;inset:0;z-index:90;background:var(--color-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-sm);padding:var(--space-sm)}

    customConcerns:[], customFlags:[],
    ratings:{personal:{topic:2,info:1,order:0,feel:1,ending:0,links:2,who:2,grammar:2,words:1}, fiction:{lit:2,feelq:1,probq:1,parts:1}, convo:{cf_starters:1,cf_answer:2,cf_question:1,turn:2,cf_popins:1}},
    sampleNotes:{personal:"Prompt: fell off scooter (Pip and Posy). ‘I fell. Mum put a bandaid. I was riding. Dad was there.’"},

function blankClient(){
  return {id:uid(), name:"", age:"", band:"6-8", year:"", notes:"", purposes:[], concerns:[], genres:[], flags:[],
    customConcerns:[], customFlags:[], ratings:{}, sampleNotes:{}, goals:[], ladderLog:[], planNotes:"", tab:"triage", updated:Date.now()};
}
function normalise(c){
  ["purposes","concerns","genres","flags","customConcerns","customFlags","goals","ladderLog"].forEach(k=>{ if(!Array.isArray(c[k])) c[k]=[]; });
  ["ratings","sampleNotes","src"].forEach(k=>{ if(!c[k]||typeof c[k]!=="object") c[k]={}; });
  Object.keys(c.src).forEach(k=>{ if(k in LEGACY && LEGACY[k] && !c.src[LEGACY[k]]) c.src[LEGACY[k]]=c.src[k]; });
  c.concerns=[...new Set(c.concerns.map(k=>k in LEGACY?LEGACY[k]:k).filter(Boolean))];
  c.purposes=c.purposes.map(x=>({"Inform goals":"Goal setting","Monitor progress":"Progress monitoring"})[x]||x);
  if(c.dob){ const a=ageFromDob(c.dob); if(a) c.age=a; }
  if(c.tab==="goals") c.tab="plan";
  if(!["triage","assess","plan","session","parents","refs","library"].includes(c.tab)) c.tab="triage";
  return c;
}

let clients=[], currentId=null, db=null, myId=null, mode="local";
const LS_KEY="storyCompass.clients.v1";
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function setSave(t){ $("saveState").textContent=t; }
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"[]"); }catch(e){ return []; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(clients.filter(c=>!c.example))); }catch(e){} }

const timers={}, writing={};
function persist(c){
  c.updated=Date.now(); try{ renderSteps(); }catch(e){}
  if(c.example){ setSave("Example, not saved"); return; }
  if(mode==="local"){ lsSave(); setSave("Saved on this device"); return; }
  setSave("Saving…");
  clearTimeout(timers[c.id]);
  timers[c.id]=setTimeout(async()=>{
    if(writing[c.id]){ persist(c); return; }
    writing[c.id]=true;
    try{ const body=clone(c); delete body.tab; await db.collection("data/users/"+myId).doc(c.id).set(body); setSave("Saved"); }
    catch(e){ setSave(e&&e.code==="quota_exceeded"?"Storage full. Delete old clients.":"Couldn’t save. Check your connection."); }
    finally{ writing[c.id]=false; }
  },700);
}
async function removeClient(c){
  clients=clients.filter(x=>x.id!==c.id);
  if(!c.example){
    if(mode==="local") lsSave();
    else { try{ await db.collection("data/users/"+myId).doc(c.id).delete(); }catch(e){ setSave("Couldn’t delete. Try again."); } }
  }
  currentId=clients[0]?clients[0].id:null; renderAll();
}

/* =========================================================
   LOGIC
   ========================================================= */
const cur = () => clients.find(c=>c.id===currentId);
const gname = (g,c) => GENRES[g].name[c.band];
function concernsFor(c){ return CONCERNS.filter(k=>!k.bands||k.bands.includes(c.band)).concat(c.customConcerns.map(k=>({id:k.id,label:k.label,g:[k.g],custom:true}))); }
function flagsFor(c){ return FLAGS.concat(c.customFlags.map(f=>({id:f.id,label:f.label,custom:true}))); }
function rating(c,g,i){ const r=(c.ratings[g]||{})[i]; return (r===undefined||r===null)?-1:r; }
function itemOf(g,id){ return GENRES[g] && GENRES[g].items.find(i=>i.id===id); }
function srcText(c,id,lead=""){ const a=(c.src||{})[id]; return a&&a.length?`${lead}(${a.join(", ")})`:""; }
function potentialGoals(c){
  const out=[], seen=new Set();
  concernsFor(c).filter(k=>c.concerns.includes(k.id)).forEach(k=>(k.it||[]).forEach(key=>{
    if(seen.has(key)) return; seen.add(key);
    const [g,id]=key.split("."), it=itemOf(g,id); if(!it||!X[key]||!expected(c,g,id)) return;
    out.push({k,g,it,key});
  }));
  return out;
}
function firstName(c){ return (c.name||"").replace(/\(.*?\)/g,"").trim() || "your child"; }

function suggestion(c){
  const score={}, reasons={}, add=(g,s,r)=>{ score[g]=(score[g]||0)+s; if(r) (reasons[g]=reasons[g]||[]).push(r); };
  const picked=concernsFor(c).filter(k=>c.concerns.includes(k.id));
  picked.forEach(k=>k.g.forEach((g,i)=>add(g,i===0?2:1)));
  Object.keys(score).forEach(g=>{
    const why=picked.filter(k=>k.g.includes(g)).map(k=>k.label.charAt(0).toLowerCase()+k.label.slice(1)+srcText(c,k.id," "));
    reasons[g]=[`Indicated by: ${why.join(", ")}.`, WHY[g].fn];
    if(WHY[g].age[c.band]) reasons[g].push(WHY[g].age[c.band]);
  });
  const f=id=>c.flags.includes(id);
  if(score.personal||score.fiction){
    if(f("books")){ add("personal",1,"Doesn’t depend on book exposure, so it’s a fairer first look."); if(score.fiction) add("fiction",-1,"With limited book exposure, a weak retell may reflect experience rather than language. Read it with that in mind."); }
    if(f("multi")) add("personal",1,"Kids from all cultures tell personal stories, so it’s a fairer first look. Compare with how stories are told at home.");
    if(f("scripts")) add("personal",1,"Routines are fine but own stories are hard, and these aren’t interchangeable, so look at own stories directly.");
    if(f("emotion")) add("personal",0,"Watch the feelings part closely. Emotion knowledge supports personal stories.");
    if(f("anxious")){ add("personal",0,"Lower the stakes: share your own story first or start from a trigger book."); if(score.fiction) add("fiction",0,"A retell from a book is structured and less personal, so it can be an easier warm-up."); }
    if(f("memory")&&score.fiction) add("fiction",0,"Keep the pictures in view for the retell to reduce memory load.");
  }
  if(score.convo && f("anxious")) add("convo",0,"Start with their favourite topic and plenty of wait time.");
  const ranked=Object.keys(score).sort((a,b)=>score[b]-score[a]);
  if(c.band!=="teen" && ranked.length){
    const has=g=>ranked.includes(g);
    if(has("personal")&&!has("fiction")){ ranked.push("fiction"); reasons.fiction=["Personal and fictional stories are only mildly linked, so a child can do well in one and not the other. Quick to run with a picture book."]; }
    else if(has("fiction")&&!has("personal")){ ranked.push("personal"); reasons.personal=["Personal and fictional stories are only mildly linked, so don’t assume from one to the other. Quick to get with a ‘give a story to get a story’ prompt."]; }
  }
  const skip=GENRE_ORDER.filter(g=>!ranked.includes(g));
  return {ranked,reasons,skip};
}
function applySuggestion(c){ c.genres=suggestion(c).ranked.slice(); }

function priorities(c){
  const out=[];
  c.genres.forEach(g=>{ if(!GENRES[g]) return; GENRES[g].items.forEach(it=>{ const r=rating(c,g,it.id); if((r===0||r===1)&&expected(c,g,it.id)) out.push({g,it,r}); }); });
  out.sort((a,b)=>a.it.t-b.it.t || a.r-b.r);
  return out;
}
function contextLines(c){ return c.concerns.map(k=>CONTEXTS[k]&&CONTEXTS[k][c.band]).filter(Boolean); }
function usedRefs(c){
  const s=new Set(); Object.entries(REFS).forEach(([k,r])=>{ if(r.always) s.add(k); });
  c.genres.forEach(g=>{ if(GENRES[g]) GENRES[g].refs.forEach(r=>s.add(r)); });
  c.flags.forEach(f=>{ const fl=FLAGS.find(x=>x.id===f); if(fl) s.add(fl.ref); });
  if(priorities(c).some(p=>p.it.t===3)){ s.add("owen"); s.add("nelson"); }
  if(c.genres.includes("personal")) s.add("globaltales");
  if(c.genres.includes("personal")||c.genres.includes("fiction")){ s.add("kknight"); s.add("petersen2022"); s.add("spencer2024"); }
  if(c.concerns.includes("written")) s.add("kirby2021");
  return s;
}
function draftGoal(c,p){
  const x=X[p.g+"."+p.it.id], nm=firstName(c)==="your child"?"The child":firstName(c);
  return {id:uid(), g:p.g, item:p.it.id, text:`${nm} will ${x.goal}, ${x.sup}, in 4 out of 5 opportunities across 3 sessions.`, lt:`${nm} will ${LONGTERM[p.g]}.`, tries:[]};
}
function syncGoals(c){ if(!c.goals.length && !c.goalsTouched) priorities(c).slice(0,3).forEach(p=>c.goals.push(draftGoal(c,p))); }
function sessionFor(c,go){
  if(go.item==="__ck"){ const ctx=contextLines(c); return [["Warm-up · 5 min",WARMUP[go.g]],["Main · 20 min",`Practise ${CK[go.g].task} with the organiser; tick the checklist each time, then fade the organiser.`],["Real life · 5 min",ctx.length?`Practise in a real context: ${ctx[0]}.`:REAL[go.g][bandKey(c.band)]],["Wrap-up · 5 min","Log the score and show the parent the checklist."]]; }
  const it=itemOf(go.g,go.item); if(!it) return [];
  const ctx=contextLines(c);
  return [["Warm-up · 5 min",WARMUP[go.g]],["Main · 20 min",`${it.how} Visual: ${it.vis}.`],["Real life · 5 min",ctx.length?`Practise in a real context: ${ctx[0]}.`:"Practise with a real story or task from their week."],["Wrap-up · 5 min","Show the parent the organiser and one home tip from the parent sheet."]];
}
function whereAt(c,g){
  const items=GENRES[g].items.filter(it=>rating(c,g,it.id)>=0);
  return {strong:items.filter(it=>rating(c,g,it.id)>=2).map(it=>it.label), working:items.filter(it=>rating(c,g,it.id)<=1).map(it=>it.label)};
}

function renderList(){
  const el=$("clientSel");
  if(!clients.length){ el.innerHTML=`<option>No clients yet</option>`; return; }
  el.innerHTML=clients.slice().sort((a,b)=>b.updated-a.updated).map(c=>`<option value="${c.id}" ${c.id===currentId?"selected":""}>${esc(c.name||"Unnamed client")}${c.age?" · "+esc(c.age):""}</option>`).join("");
  el.onchange=()=>{ currentId=el.value; renderAll(); };
}
const TABS=[["triage","Triage"],["assess","Assessment"],["plan","Plan and goals"],["session","Session"],["parents","Parent sheet"],["refs","References"]];
function stepDone(c,k){
  if(k==="triage") return c.concerns.length>0 && c.genres.length>0;
  if(k==="assess") return Object.values(c.ratings).some(r=>r&&Object.values(r).some(v=>v!==null&&v!==undefined));
  if(k==="plan") return c.goals.length>0;
  if(k==="session") return c.ladderLog.length>0;
  return false;
}
function renderSteps(){
  const el=$("stepNav"), c=cur();
  if(!c){ el.innerHTML=""; return; }
  el.innerHTML=TABS.map(([k,l],i)=>`<button class="sn ${c.tab===k?"on":""}" title="${l}" role="tab" aria-selected="${c.tab===k}" data-tab="${k}"><i>${i+1}</i><span>${l}</span>${stepDone(c,k)?'<b class="ck" aria-label="done">✓</b>':""}</button>`).join("")+`<span class="cap" style="margin-top:8px">Reference</span><button class="sn ${c.tab==="library"?"on":""}" title="Library" data-tab="library"><i>L</i><span>Library</span></button>`;
  el.querySelectorAll(".sn").forEach(b=>b.onclick=()=>{ c.tab=b.dataset.tab; renderSteps(); renderPane(); });
}
let headOpen=null;
function renderPane(){
  const p=$("pane"), c=cur();
  if(!c){ p.innerHTML=`<div class="card empty"><h2>Start a client file</h2><p>Add a client to triage their genre, rate a sample and get a plan.</p></div>`; return; }
  if(headOpen===null) headOpen=window.innerWidth>=960||!c.name;
  p.innerHTML=`
    <details class="headd" id="headd" ${headOpen?"open":""}><summary><b>${esc(c.name||"New client")}</b><span class="mini">${esc([c.age,c.year].filter(Boolean).join(", "))}</span><span class="hedit">Edit details</span></summary>
    <div class="head">
      <div class="field"><label for="f-name">Client (initials)</label><input type="text" id="f-name" value="${esc(c.name)}" placeholder="J.T."></div>
      <div class="field"><label for="f-dob">Date of birth</label><input type="text" id="f-dob" inputmode="numeric" autocomplete="off" placeholder="DD/MM/YYYY" maxlength="10" value="${esc(dobShow(c.dob))}"><span class="mini" id="dobMsg"></span></div>
      <div class="field"><label for="f-age">Age${c.dob?" (from DOB)":""}</label><input type="text" id="f-age" value="${esc(c.age)}" placeholder="8;4" ${c.dob?"readonly":""}></div>
      <div class="field"><label for="f-band">Age band</label><select id="f-band">${Object.entries(BANDS).map(([k,v])=>`<option value="${k}" ${c.band===k?"selected":""}>${v.label}</option>`).join("")}</select></div>
      <div class="field"><label for="f-year">Year / setting</label><input type="text" id="f-year" value="${esc(c.year)}" placeholder="Year 3"></div>
    </div></details>
    <div class="body" id="tabBody"></div>`;
  $("headd").ontoggle=e=>{ headOpen=e.target.open; };
  ["name","age","year"].forEach(f=>{ $("f-"+f).oninput=e=>{ if(f==="age"&&c.dob) return; c[f]=e.target.value; persist(c); if(f!=="year") renderList(); }; });
  $("f-dob").oninput=e=>{ const t=e.target.value; $("dobMsg").textContent="";
    if([...t].some((ch,i)=>/[\/.\- ]/.test(ch)&&i!==2&&i!==5)){ const c2=t.replace(/[^\d\/.\- ]/g,""); if(c2!==t) e.target.value=c2; if(/^\d{1,2}[\/.\- ]\d{1,2}[\/.\- ]\d{4}$/.test(c2)) setDob(c2); return; }
    const v=t.replace(/\D/g,"").slice(0,8); let o=v; if(v.length>4) o=v.slice(0,2)+"/"+v.slice(2,4)+"/"+v.slice(4); else if(v.length>2) o=v.slice(0,2)+"/"+v.slice(2); if(o!==t) e.target.value=o; if(v.length===8) setDob(o); };
  $("f-dob").onblur=e=>{ const v=e.target.value.trim(); if(!v){ if(c.dob){ c.dob=""; persist(c); renderAll(); } return; } setDob(v); };
  $("f-dob").onkeydown=e=>{ if(e.key==="Enter") e.target.blur(); };
  function setDob(v){ const d=dobParse(v); if(!d){ $("dobMsg").textContent="Check the date (DD/MM/YYYY)"; return; } if(d===c.dob) return; c.dob=d; if(c.dob){ c.age=ageFromDob(c.dob); const b=bandFor(c.age); if(b&&b!==c.band){ c.band=b; const valid=concernsFor(c).map(k=>k.id); c.concerns=c.concerns.filter(k=>valid.includes(k)); if(!c.genresManual) applySuggestion(c); } } persist(c); renderAll(); }
  $("f-band").onchange=e=>{ c.band=e.target.value; const valid=concernsFor(c).map(k=>k.id); c.concerns=c.concerns.filter(k=>valid.includes(k)); if(!c.genresManual) applySuggestion(c); persist(c); renderAll(); };
  ({triage:renderTriage,assess:renderAssess,plan:renderPlan,session:renderSession,parents:renderParents,refs:renderRefs,library:renderLibrary})[c.tab](c,$("tabBody"));
}
function chipRow(list,selected,key,extra=""){
  return `<div class="chips">${list.map(x=>`<button class="chip ${x.g?"gchip g-"+x.g:""} ${selected.includes(x.id)?"on":""}" aria-pressed="${selected.includes(x.id)}" data-k="${key}" data-v="${esc(x.id)}">${esc(x.label)}${x.custom?`<span class="x" data-del="${esc(x.id)}" data-dk="${key}" title="Remove">×</span>`:""}</button>`).join("")}${extra}</div>`;
}

/* ---------- 1 triage ---------- */

  <div class="pcols">
   <section><h3>Running it (about 20 minutes)</h3><ol>

function talesHTML(){ return `<details class="tales proto" ${po("tales")}><summary><b>Global TALES</b> <span class="agetag">Standard protocol</span></summary>

/* ---------- 2 assess ---------- */
function itemRow(c,g,it){
  const r=rating(c,g,it.id), sc=it.cp?CPPEV_SCALE:SCALE;
  const ok=expected(c,g,it.id), a=AGE[g+"."+it.id];
  return `<div class="item ${ok?"":"nyet"}"><div><b>${esc(it.label)}</b> ${a!==undefined?`<span class="agetag ${ok?"":"no"}">${ok?"By ~"+a:"Not yet expected · ~"+a+"+"}</span>`:""}<div class="q">${esc(it.q)}</div></div>
    <div class="seg" role="group" aria-label="${esc(it.label)}">${sc.map((s,v)=>`<button data-g="${g}" data-i="${it.id}" data-v="${v}" class="${r===v?"on":""}" aria-pressed="${r===v}">${s}</button>`).join("")}</div>
    ${it.cp&&r>=0?`<div class="lvdesc"><b>${esc(PLAINLV[it.id][r][0])}.</b> ${esc(PLAINLV[it.id][r][1])}</div>`:""}
    ${it.cp?`<details><summary>Rubric wording</summary><ol>${RUB[it.id].map(l=>`<li>${esc(l)}</li>`).join("")}</ol></details>`:""}</div>`;
}
function assessSummary(c){
  const nm=firstName(c)==="your child"?"The child":firstName(c), gs=c.genres.filter(g=>GENRES[g]);
  const blocks=[];
  gs.forEach(g=>{
    const G=GENRES[g], rated=G.items.filter(it=>rating(c,g,it.id)>=0);
    const log=((c.ckLog||{})[g]||[]).slice(-1)[0], act=ckItems(c,g).filter(i=>i.ok), cur=((c.ck||{})[g]||[]).filter(id=>act.some(i=>i.id===id));
    const ck=log?{n:log.n,t:log.t,d:log.d}:(cur.length?{n:cur.length,t:act.length}:null);
    const missing=ck&&!log?act.filter(i=>!cur.includes(i.id)).map(i=>i.l.split(":")[0].toLowerCase()):null;
    if(!rated.length&&!ck&&!(g==="personal"&&c.hpa)&&!(g==="opinion"&&c.ps&&c.ps.ai)) return;
    const strong=rated.filter(it=>rating(c,g,it.id)>=2).map(it=>it.label.toLowerCase());
    const need=rated.filter(it=>rating(c,g,it.id)<=1&&expected(c,g,it.id)).map(it=>it.label.toLowerCase());
    const early=rated.filter(it=>rating(c,g,it.id)<=1&&!expected(c,g,it.id)).map(it=>it.label.toLowerCase());
    const parts=[];
    if(ck) parts.push(`included ${ck.n} of ${ck.t} expected parts${ck.d?` (${ck.d})`:""}${missing&&missing.length?`; not yet: ${missing.join(", ")}`:""}`);
    if(g==="personal"&&c.hpa){ const h=HPA.find(x=>x.id===c.hpa); parts.push(`structure was ${h.label.toLowerCase()}${c.hpa!=="classic"&&clientAge(c)>=6?" (classic narratives are typical by about 6)":""}`); }
    if(g==="opinion"&&c.ps&&c.ps.ai){ const A=c.ps.ai, tot=(A.pss||[]).reduce((a,x)=>a+(+x.score||0),0); parts.push(`in a planned persuasive sample${c.ps.d?` (${c.ps.d})`:""} produced ${A.cunits} C-units (MLCU ${A.mlcu}, clausal density ${A.clausalDensity}; ${A.errorPct}% of C-units with errors) and scored ${tot}/35 on the Persuasion Scoring Scheme (typical Year 8–12: MLCU about 16, clausal density about 2.0)`); }
    if(strong.length) parts.push(`strengths in ${strong.join(", ")}`);
    if(need.length) parts.push(`difficulties with ${need.join(", ")}`);
    let t=`${G.name[c.band]}: ${nm} ${parts.join("; ")}.`;
    if(early.length) t+=` Not yet expected for age: ${early.join(", ")}.`;
    blocks.push({g,t});
  });
  const bg=flagsFor(c).filter(f=>c.flags.includes(f.id)).map(f=>f.label.toLowerCase()+srcText(c,f.id," "));
  const fi=impactLines(c).map(l=>l.text);
  const pr=priorities(c).slice(0,3).map(p=>p.it.label.toLowerCase());
  const intro=`${nm}${c.age?` (${c.age})`:""} completed language sampling in ${gs.map(g=>GENRES[g].name[c.band].toLowerCase()).join(", ")}.`;
  return {intro,blocks,bg:bg.length?`Relevant factors: ${bg.join(", ")}.`:"",fi:fi.join(" "),pr:pr.length?`Suggested priorities: ${pr.join(", ")}.`:""};
}
function renderAssess(c,el){
  const gs=c.genres.filter(g=>GENRES[g]);
  if(!gs.length){ el.innerHTML=`<div class="card empty"><p>No genres picked yet. Choose them in Triage.</p></div>`; return; }
  const tab=c.asG==="summary"?"summary":(gs.includes(c.asG)?c.asG:gs[0]);
  const bpcDone=(c.bpc||[]).length;
  const tabs=`<div class="astabs">${gs.map(g=>`<button class="ast g-${g} ${tab===g?"on":""}" data-asg="${g}">${esc(gname(g,c))}</button>`).join("")}<button class="ast sum ${tab==="summary"?"on":""}" data-asg="summary">Summary</button>
    <details class="bpdrop"><summary>Assessment checklist ${bpcDone}/${BPC.length}</summary><div class="bpc">${BPC.map(([id,l,q])=>`<label><input type="checkbox" data-bpc="${id}" ${(c.bpc||[]).includes(id)?"checked":""}><span><b>${l}</b><br><span class="mini">${q}</span></span></label>`).join("")}<p class="mini">Westerveld, adapted from Gillon et al. (2006)</p></div></details></div>`;
  if(tab==="summary"){
    const S=assessSummary(c), full=[S.intro,...S.blocks.map(b=>b.t),S.bg,S.fi,S.pr].filter(Boolean).join("\n\n");
    el.innerHTML=tabs+`<section class="card"><div class="trow" style="justify-content:space-between;align-items:center"><h2>Assessment summary</h2><button class="btn sm pri" id="copySum">Copy</button></div>
      <p>${esc(S.intro)}</p>
      ${S.blocks.length?`<div class="sumg">${S.blocks.map(b=>`<div class="sumc g-${b.g}"><p>${esc(b.t)}</p></div>`).join("")}</div>`:`<div class="callout">Rate skills or log a checklist score and the summary fills in.</div>`}
      ${S.bg?`<p>${esc(S.bg)}</p>`:""}${S.fi?`<p>${esc(S.fi)}</p>`:""}${S.pr?`<p><b>${esc(S.pr)}</b></p>`:""}
      <span class="mini" id="sumMsg">Edit wording in your report as needed.</span><textarea id="sumFallback" hidden readonly></textarea></section>`;
    bindAsTabs(c,el);
    $("copySum").onclick=()=>{ const fail=()=>{ const t=$("sumFallback"); t.hidden=false; t.value=full; t.style.minHeight="200px"; t.select(); $("sumMsg").textContent="Select and copy from the box"; };
      try{ navigator.clipboard.writeText(full).then(()=>{ $("sumMsg").textContent="Copied"; },fail); }catch(e){ fail(); } };
    return;
  }
  const g=tab, G=GENRES[g], main=G.items.filter(i=>!i.pa), pa=G.items.filter(i=>i.pa);
  el.innerHTML=tabs+`${g==="personal"||g==="opinion"?`<div class="protorow g-${g}">${g==="personal"?photoHTML()+talesHTML():persuadeHTML()}</div>`:""}<div class="ascols g-${g}">
    <div class="ascol">
      <section class="card">
        <span class="lbl2">${esc(G.blurb)}</span>
        ${G.prompts[c.band]?`<p style="font-size:.9rem"><b>Get a sample:</b> ${esc(G.prompts[c.band])}</p>
        <details class="elicit"><summary>More ideas</summary><div class="detg">
          <div><span class="k">${c.band==="teen"?"Teens":"Ideas"}</span><ul>${(c.band==="teen"?ELICIT[g].teen.concat(ELICIT[g].young):ELICIT[g].young.concat(ELICIT[g].teen.map(t=>"Older kids: "+t))).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
          <div><span class="k">Any genre</span><ul>${ELICIT_TIPS.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div></div></details>`:""}
      </section>
      ${g==="opinion"?psHTML(c):""}
      ${ckHTML(c,g)}
      ${g==="personal"?`<section class="card" style="padding:0">${hpaHTML(c)}</section>`:""}
      <section class="card" style="padding:0"><details class="more"><summary>Sample notes${(c.sampleNotes[g]||"").trim()?" ✓":""}</summary><div style="padding:0 16px 12px"><textarea id="sn-${g}" data-g="${g}" placeholder="Prompt used, a few key lines…">${esc(c.sampleNotes[g]||"")}</textarea></div></details></section>
      <section class="card" style="padding:0"><details class="more"><summary>Clinical observations (${c.flags.length})</summary><div style="padding:0 16px 12px">${chipRow(flagsFor(c),c.flags,"flags")}</div></details></section>
    </div>
    <section class="gcard ascol2">
      ${[1,2,3].map(t=>{ const its=main.filter(i=>i.t===t); return its.length?`<div class="tierhead">${TIERS[t]}</div><div class="itgrid">${its.map(it=>itemRow(c,g,it)).join("")}</div>`:""; }).join("")}
      ${pa.length?`<details class="more" ${pa.some(i=>rating(c,g,i.id)>=0)?"open":""}><summary>CPPEV practice activities (${pa.length})</summary><div class="itgrid">${pa.map(it=>itemRow(c,g,it)).join("")}</div></details>`:""}
      ${g==="convo"?`<div class="attr">Rubrics adapted from CPPEV, © 2021 Anna Vagin, PhD. Items without rubric wording are plain-language extras.</div>`:""}
    </section>
  </div>`;
  bindAsTabs(c,el);
  el.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    const g=b.dataset.g,i=b.dataset.i,v=+b.dataset.v;
    c.ratings[g]=Object.assign({},c.ratings[g]||{});
    c.ratings[g][i]=c.ratings[g][i]===v?null:v; persist(c); renderAssess(c,el);
  });
  bindCk(c,el,()=>renderAssess(c,el));
  bindPs(c,el,()=>renderAssess(c,el));
  el.querySelectorAll("[data-hpa]").forEach(b=>b.onclick=()=>{ c.hpa=c.hpa===b.dataset.hpa?"":b.dataset.hpa; persist(c); renderAssess(c,el); });
  el.querySelectorAll("[data-thc]").forEach(b=>b.onchange=()=>{ const a=(c.thc||[]).filter(x=>x!==b.dataset.thc); if(b.checked) a.push(b.dataset.thc); c.thc=a; persist(c); renderAssess(c,el); });
  el.querySelectorAll("textarea[data-g]").forEach(t=>t.oninput=e=>{ c.sampleNotes=Object.assign({},c.sampleNotes,{[t.dataset.g]:e.target.value}); persist(c); });
  el.querySelectorAll(".chip[data-k]").forEach(b=>b.onclick=()=>{ const arr=c.flags.slice(),i=arr.indexOf(b.dataset.v); i>=0?arr.splice(i,1):arr.push(b.dataset.v); c.flags=arr; persist(c); renderAssess(c,el); });
}
function bindAsTabs(c,el){
  el.querySelectorAll("[data-asg]").forEach(b=>b.onclick=()=>{ c.asG=b.dataset.asg; renderAssess(c,el); });

/* ---------- persuasive dump zone ---------- */
const PS_NORM={cu:29,min:3.4,mlcu:16.3,cd:2.0,err:20};
const PS_FEAT=["Issue and desired change","Supporting reasons","Other point of view","Compromises","Conclusion","Cohesion","Effectiveness"];
const PS_PARTS=[["issue","Issue + change",/\b(should(n'?t)?|need to|needs to|have to|has to|must|ought to|want (them|the school|it|people) to|change|ban|banned|allow(ed)?|get rid of)\b/i],
 ["reasons","Reasons",/\b(because|cause|'cos|cos|since|the reason|so that)\b/i],
 ["example","Example",/\b(for example|for instance|like when|one time|like last|e\.g\.)\b/i],
 ["other","Other side",/\b(some people|other people|people (might|would|will|may) (say|think|argue)|(they|you|teachers?|parents?|adults?|the principal|my boss) (might|would|could|may) (say|think|argue)|on the other hand|the other side|i know (that )?(some|people|it))\b/i],
 ["response","Answers it",/\b(but|however|although|even though|that's not|i disagree|that doesn't mean)\b/i],
 ["compromise","Compromise",/\b(compromise|instead|maybe (we|they|you|the school) could|what if|at least|middle|only (on|at|if|during|for)|a few days|half|trial)\b/i],
 ["conclusion","Conclusion",/\b(in conclusion|overall|to sum up|that's why|so (yeah|basically|that's|overall|i think)|in the end)\b/i]];
const PS_WORDS=["should","must","need to","because","however","although","even though","therefore","for example","on the other hand","unless","if","which","instead"];
function psClean(t){ return String(t||"").split(/\n/).filter(l=>!/^\s*(E|Ex|Examiner|SLP|Clinician|Me)\s*[:\-]/i.test(l)).map(l=>l.replace(/^\s*(C|S|Student|Child|Client|[A-Z]{1,3})\s*[:\-]\s*/,"")).join("\n"); }
function psLocal(text,secs){
  const t=psClean(text), w=(t.toLowerCase().match(/[a-z]+(?:'[a-z]+)?/g)||[]);
  if(!w.length) return null;
  const fil=(t.match(/\b(um+|uh+|er+m?|ah+|hmm+)\b/gi)||[]).length+(t.match(/\b(you know|i mean)\b/gi)||[]).length*2;
  let rep=0; for(let i=1;i<w.length;i++) if(w[i]===w[i-1]&&!["very","really","had","that","no"].includes(w[i])) rep++;
  let mattr=null; if(w.length>=50){ let sum=0,n=0; for(let i=0;i+50<=w.length;i++){ sum+=new Set(w.slice(i,i+50)).size/50; n++; } mattr=sum/n; }
  const parts={}; PS_PARTS.forEach(([k,,re])=>parts[k]=re.test(t)); if(!parts.other) parts.response=false;
  const reasons=(t.match(/\b(because|cause|'cos|since|the reason)\b/gi)||[]).length;
  const found=PS_WORDS.filter(x=>new RegExp("\\b"+x+"\\b","i").test(t));
  return {words:w.length,wpm:secs?Math.round(w.length/(secs/60)):null,fill:Math.round((fil+rep)/w.length*1000)/10,mattr:mattr&&Math.round(mattr*100)/100,parts,reasons,found};
}
function psSecs(v){ v=String(v||"").trim(); if(!v) return 0; const m=v.split(":"); return m.length>1?(+m[0]||0)*60+(+m[1]||0):(+v||0)*60; }
function psBar(lbl,v,norm,suf,note){ if(v==null||isNaN(v)) return ""; const max=norm*1.6, pct=Math.min(100,v/max*100), mk=norm/max*100;
  return `<div class="psbar"><span>${lbl}</span><div class="tr"><div class="fl" style="width:${pct}%"></div><div class="mk" style="left:${mk}%" title="Typical Year 8–12"></div></div><span><b>${v}${suf||""}</b> <span class="mini">/ ~${norm}${suf||""}${note?" "+note:""}</span></span></div>`; }
function psHTML(c){
  const P=c.ps||{}, L=P.local, A=P.ai, pr=P.prompts||[];
  const prompts=[["else","“Anything else?”"],["what","“What about…?”"],["plan","“Plan the gap”"]];
  return `<section class="card psz g-opinion"><div class="trow" style="justify-content:space-between;align-items:center"><h2>Dump zone: analyse a sample</h2>${P.d?`<span class="mini">Last: ${esc(P.d)}</span>`:""}</div>
   <p class="mini">Paste the dictation text. Messy is fine: Claude splits it into C-units. Lines starting with “E:” or “Examiner:” are skipped. Use initials, not names.</p>
   <textarea id="psText" placeholder="Paste what they said…">${esc(P.text||"")}</textarea>
   <div class="psrow"><label>Talk time <input type="text" id="psTime" placeholder="3:20" value="${esc(P.time||"")}"></label>
    <span class="mini">Prompts used:</span>${prompts.map(([k,l])=>`<label><input type="checkbox" data-psp="${k}" ${pr.includes(k)?"checked":""}>${l}</label>`).join("")}</div>
   <div class="psrow"><button class="btn" id="psGo">Quick count</button><button class="btn pri" id="psAI">Score with Claude</button><button class="btn ghost" id="psStop" hidden>Stop</button><span class="mini" id="psMsg"></span>${P.text?`<button class="btn ghost" id="psClear" style="margin-left:auto">Clear</button>`:""}</div>
   ${L?`<div class="psgrid"><div><b>${L.words}</b><span>words</span></div>${L.wpm?`<div><b>${L.wpm}</b><span>words/min</span></div>`:""}<div><b>${L.reasons}</b><span>“because”-type reasons</span></div><div><b>${L.fill}%</b><span>fillers + repeats (rough mazes)</span></div>${L.mattr?`<div><b>${L.mattr}</b><span>vocab diversity (MATTR)</span></div>`:""}</div>
     <span class="lbl2">Parts heard (keyword guess)</span><div class="pschips">${PS_PARTS.map(([k,l])=>`<span class="pschip ${L.parts[k]?"y":""}">${L.parts[k]?"✓":"○"} ${l}</span>`).join("")}</div>
     <span class="lbl2">Persuasive words used</span><div class="pschips">${L.found.length?L.found.map(x=>`<span class="pschip y">${esc(x)}</span>`).join(""):`<span class="mini">None found</span>`}</div>`:""}
   <div id="psOut">${A?psAIHTML(A,P):""}</div></section>`;
}
function psAIHTML(A,P){
  const secs=psSecs(P.time), cuNorm=secs?Math.round(PS_NORM.cu/PS_NORM.min*(secs/60)):PS_NORM.cu, tot=(A.pss||[]).reduce((a,x)=>a+(+x.score||0),0);
  return `<div class="psai"><div class="trow" style="justify-content:space-between;align-items:center"><span class="lbl2">Claude’s scoring</span><span class="mini">Bar marker = typical Year 8–12</span></div>
   <div class="psbars">${psBar("C-units",A.cunits,cuNorm,"",secs?"for this time":"")}${psBar("Mean length (MLCU)",A.mlcu,PS_NORM.mlcu)}${psBar("Clausal density",A.clausalDensity,PS_NORM.cd)}${psBar("C-units with errors",A.errorPct,PS_NORM.err,"%")}${A.mazePct!=null?`<div class="psbar"><span>Mazes</span><span class="mini" style="grid-column:span 2">${A.mazePct}% of words</span></div>`:""}</div>
   <span class="lbl2">Persuasion Scoring Scheme · ${tot}/35</span>
   <div class="pss">${(A.pss||[]).map(x=>`<details><summary><span>${esc(x.f)}</span><span class="dots">${"●".repeat(+x.score||0)}${"○".repeat(5-(+x.score||0))}</span></summary>${esc(x.why||"")}${x.quote?`<q>${esc(x.quote)}</q>`:""}</details>`).join("")}</div>
   ${(A.strengths||[]).length?`<p style="font-size:.86rem"><b>Strengths:</b> ${A.strengths.map(esc).join("; ")}</p>`:""}
   ${(A.targets||[]).length?`<p style="font-size:.86rem"><b>Possible targets:</b> ${A.targets.map(esc).join("; ")}</p>`:""}

const GHEX={personal:[212,101,63],fiction:[85,102,196],explain:[47,143,122],opinion:[176,128,20],convo:[154,82,166]};
const ascii=s=>String(s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/…/g,"...").replace(/·/g,"-").replace(/×/g,"x").replace(/č/g,"c");
async function makePDF(c){
  const msg=$("sheetMsg");
  if(!window.jspdf){ msg.textContent="The PDF maker didn’t load. Reload the page and try again."; return; }
  const d=sheetData(c), {jsPDF}=window.jspdf, doc=new jsPDF({unit:"mm",format:"a4"});
  const M=18, CW=210-2*M; let y=22; const col=GHEX[d.go.g];
  const para=(t,size=11,style="normal",gap=2,color=[40,36,32])=>{ doc.setTextColor(...color); doc.setFont("helvetica",style); doc.setFontSize(size); const lines=doc.splitTextToSize(ascii(t),CW); doc.text(lines,M,y); y+=lines.length*size*0.42+gap; };
  const room=h=>{ if(y+h>282){ doc.addPage(); y=22; } };
  para(d.title,18,"bold",5,col);
  if(d.where.length){
    para("Where "+d.name+" is at",12,"bold",2);
    d.where.forEach(w=>{
      const lines=[["What we expect at this age",w.typical],w.strong.length?["Going well",w.strong.join(", ")]:null,w.working.length?["Working on",w.working.join(", ")]:null].filter(Boolean);
      doc.setFontSize(10); const h=8+lines.reduce((a,[,v])=>a+doc.splitTextToSize(ascii(v),CW-8).length*4.3+5,0);
      room(h); const wc=GHEX[w.g];
      doc.setFillColor(...wc); doc.rect(M,y,2,h-2,"F");
      doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...wc); doc.text(ascii(w.name),M+5,y+5);
      let yy=y+10;
      lines.forEach(([k,v])=>{ doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(110,100,90); doc.text(ascii(k.toUpperCase()),M+5,yy); yy+=4;
        doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(40,36,32); const ls=doc.splitTextToSize(ascii(v),CW-8); doc.text(ls,M+5,yy); yy+=ls.length*4.3+1; });
      y+=h+2;
    });
    y+=2;
  }
  room(30); para("What we're working on",11,"bold",1); para(d.working,11,"normal",4);
  room(24); para("Why it matters",11,"bold",1); para(d.why,11,"normal",4);
  room(30); para("Try this at home",11,"bold",2);
  d.home.forEach(h=>{ doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(40,36,32); const lines=doc.splitTextToSize(ascii(h),CW-6); room(lines.length*4.6+2); doc.text("-",M,y); doc.text(lines,M+5,y); y+=lines.length*4.6+2; });
  if(d.extra){ y+=2; room(20); para("A note from your speech pathologist",11,"bold",1); para(d.extra,11,"normal",4); }
  const drawOrg=(title,fill)=>{
    doc.addPage(); y=22; para(title,16,"bold",6,col);
    const rows=[]; let row=[], used=0;
    d.org.boxes.forEach((b,i)=>{ if(used+b[1]>2){ rows.push(row); row=[]; used=0; } row.push([b,i]); used+=b[1]; });
    if(row.length) rows.push(row);
    const gap=4, H=Math.min(38,(282-y-gap*rows.length)/rows.length), half=(CW-gap)/2;
    rows.forEach(r=>{ let x=M; r.forEach(([b,i])=>{ const w=b[1]===2?CW:half;
      doc.setDrawColor(...col); doc.setLineWidth(0.5); doc.roundedRect(x,y,w,H,2,2);
      doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...col); doc.text(ascii(b[0]),x+3,y+6);
      if(fill&&fill[i]){ doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(40,36,32); doc.text(doc.splitTextToSize(ascii(fill[i]),w-6),x+3,y+13); }
      x+=w+gap; }); y+=H+gap; });
  };
  drawOrg(d.org.name+" - "+d.name);
  drawOrg(d.org.name+": example",d.ex);
  const blob=doc.output("blob");
  const dl=window.claude&&window.claude.use?await window.claude.use("downloads").catch(()=>null):null;
  if(!dl){ msg.textContent="Downloads aren’t available in this view. Use Copy text instead."; return; }
  try{ await dl.save({filename:`Parent sheet - ${ascii(d.name)}.pdf`,data:blob}); msg.textContent="Saved."; }
  catch(e){ msg.textContent=e&&e.code==="declined"?"":"Couldn’t save the PDF. Try again."; }
}
